[project]
name = "fairsharer"
version = "0.1.0"
description = "Fair sharer exercise for DAISY"
requires-python = ">=3.10"

dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
